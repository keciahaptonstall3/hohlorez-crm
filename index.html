<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hohlorez CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* «Ночной аэропорт»: табло вылетов — тёмно-синее небо, янтарь табло, бирюза «прилетел» */
:root{
  --sky:#0D1626;--panel:#14213A;--raise:#1C2C4B;--line:#26385B;--text:#EAF0FA;--muted:#8796B3;
  --amber:#F4B740;--amber-ink:#2A1C00;--arr:#3DD6A8;--bad:#FF6E6E;--blue:#7EA6FF;
  --disp:"Unbounded",system-ui,sans-serif;--body:"Onest",system-ui,-apple-system,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sky);color:var(--text);font:15px/1.45 var(--body)}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--text);background:var(--sky);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted)}
input[type=datetime-local]{color-scheme:dark;-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
input[type=datetime-local]::-webkit-date-and-time-value{text-align:left}
textarea{min-height:84px;resize:vertical}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--sky) 82%,transparent);padding:14px 16px 10px}
.h1{font:600 22px/1.15 var(--disp);letter-spacing:-.01em;margin:0}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.ghost{color:var(--muted);font-size:14px;padding:4px 2px}
.sub{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips+.chips{margin-top:6px}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;white-space:nowrap;color:var(--muted)}
.chip.on{border-color:var(--amber);color:var(--amber)}
.chip b{font-weight:600;color:var(--text);margin-left:5px}
.chip.on b{color:var(--amber)}
.chip:disabled{opacity:.4}
.wrap{padding:4px 16px 18px}
.board{background:var(--panel);border-radius:20px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:active{background:var(--raise)}
.name{font:600 15.5px/1.25 var(--disp);letter-spacing:-.005em}
.days{grid-row:span 2;text-align:right;align-self:start}
.days b{display:block;font:600 22px/1 var(--disp);color:var(--amber)}
.days span{font-size:11.5px;color:var(--muted)}
.meta{color:var(--muted);font-size:13px}
.warn{color:var(--bad);font-size:13px}
.cm{grid-column:1/-1;margin-top:6px;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm em{font-style:normal;color:var(--text)}
.flags{font-size:14px;margin-left:6px}
.trip{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:9px}
.trip i{height:4px;border-radius:2px;background:var(--line)}
.trip i.p{background:color-mix(in srgb,var(--amber) 45%,var(--line))}
.trip i.c{background:var(--amber)}
.trip.arr i{background:var(--arr)}
.trip.arch i{background:var(--line)}
.trip-l{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px;font-size:11px;color:var(--muted)}
.trip-l span.c{color:var(--amber);font-weight:600}
.hero{padding:6px 2px 4px}
.hero .name{font-size:24px;line-height:1.15}
.hero .meta{margin-top:6px}
.stage{display:inline-block;margin-top:12px;padding:5px 10px;border-radius:8px;background:var(--amber);color:var(--amber-ink);font:600 12.5px/1.2 var(--disp);letter-spacing:.02em}
.stage.arr{background:var(--arr);color:#04261C}.stage.arch{background:var(--raise);color:var(--muted)}
.sec{background:var(--panel);border-radius:18px;padding:15px 16px;margin:12px 0}
.sec h2{font:600 14.5px/1.2 var(--disp);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2 small{font:500 12.5px var(--body);color:var(--muted)}
.sec.quiet{background:transparent;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.b{flex:1 1 auto;min-width:30%;padding:12px 14px;border-radius:13px;background:var(--raise);font-weight:600;text-align:center}
.b.main{background:var(--amber);color:var(--amber-ink)}
.b.arr{background:var(--arr);color:#04261C}
.b.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--panel))}
.b:disabled{opacity:.45}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.doc{padding:11px 6px;border-radius:12px;border:1px dashed var(--line);font-size:13.5px;text-align:center;color:var(--muted)}
.doc.on{border:1px solid var(--arr);color:var(--arr);font-weight:600}
.meter{display:flex;justify-content:space-between;align-items:baseline}
.meter b{font:600 19px var(--disp)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 12px}
.bar span{display:block;height:100%;background:var(--arr)}
.bar span.w{background:var(--amber)}.bar span.bad{background:var(--bad)}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.list li:first-child{border-top:0;padding-top:2px}
.who{color:var(--muted);font-size:12.5px;margin-bottom:2px}
.form{display:grid;gap:8px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.more{display:block;width:100%;padding:10px 0 0;color:var(--blue);font-weight:600;text-align:left}
.empty{text-align:center;color:var(--muted);padding:56px 24px}
.flyv{font:600 20px var(--disp);color:var(--amber)}
.tg{white-space:pre-wrap;font-size:14.5px;word-wrap:break-word;background:var(--panel);border-radius:18px;padding:15px 16px}
.tg b{font-weight:600}
.tg i{color:var(--muted);font-style:normal}
.tg blockquote{margin:6px 0;padding:7px 11px;border-left:2px solid var(--amber);background:var(--raise);border-radius:0 10px 10px 0;white-space:pre-wrap}
.tg code{font-size:13.5px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:color-mix(in srgb,var(--sky) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);padding:3px 0}
.nav button .e{font-size:20px;line-height:1;filter:grayscale(1) opacity(.65)}
.nav button.on{color:var(--amber);font-weight:600}
.nav button.on .e{filter:none}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--sky);font-weight:600;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.hid{display:none!important}
.mnav{display:flex;gap:8px;justify-content:space-between;margin-top:8px}
.lead .name{font-size:24px;line-height:1.15}
.timer{font:600 13px var(--disp);color:var(--amber);margin-top:8px}
.big{display:block;width:100%;padding:18px;border-radius:18px;background:var(--amber);color:var(--amber-ink);font:600 18px var(--disp);text-align:center}
.col{display:grid;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three .b{min-width:0;padding:12px 6px;font-size:14px}
.wa{border:1px solid color-mix(in srgb,var(--arr) 40%,var(--line))}
.wa .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wa .row:first-of-type{border-top:0}
.wa .row .t{flex:1;min-width:0}
.wa .row .b{flex:none;min-width:0;padding:9px 12px}
.wa-entry+.wa-entry{border-top:1px solid var(--line)}
.wa-entry .row{border-top:0}
.wa-ping{display:block;width:100%;margin:2px 0 10px;border:1px solid var(--line);color:var(--amber)}
.wa-ping:disabled{color:var(--muted);opacity:.7;cursor:default}
.seg{display:flex;gap:6px}.seg .chip{flex:1;text-align:center}
.tk{margin-top:10px}
.hdr{display:flex;gap:14px;align-items:baseline}
/* Движение только в моменты действий; без анимации длинных списков. */
.b,.chip,.doc,.item,.nav button,.more{transition:transform 140ms ease,background-color 160ms ease,color 160ms ease,opacity 160ms ease}
.b:active,.chip:active,.doc:active,.nav button:active,.more:active{transform:scale(.97)}
button:disabled{cursor:default}
input,textarea,select{transition:border-color 160ms ease}
.ui-sheet>div{animation:ui-enter 180ms ease-out}
.ui-enter{animation:ui-enter 200ms ease-out both}
@keyframes ui-enter{from{opacity:.45;transform:translateY(7px)}to{opacity:1;transform:none}}
.toast{animation:ui-enter 160ms ease-out}
.cm-reminder{border:1px solid var(--bad);margin-bottom:14px}
.cm-reminder.cm-attention{animation:cm-attention 1.5s ease-in-out 2}
@keyframes cm-attention{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 16%,transparent)}}
.cm-reminder h2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cm-reminder h2 small{color:var(--bad);flex:none}
.cm-reminder .name{margin:12px 0 4px}
.cm-reminder .acts{margin-top:10px}
.cm-editor{animation:ui-enter 160ms ease-out}
.cm-editor textarea{margin:10px 0 8px;min-height:85px;font-size:16px}
.cm-quick{padding:0 16px 14px}
.cm-quick .acts{align-items:center;justify-content:space-between}
.cm-quick .b{padding:8px 11px;font-size:13px;color:var(--amber)}
.item-wrap+.item-wrap{border-top:1px solid var(--line)}
.item-wrap .item{border-top:0}
.team-win{border:1px solid color-mix(in srgb,var(--arr) 45%,var(--line));color:var(--arr);margin-bottom:14px}
.team-win p{margin:5px 0 0;font-size:13px}
.party{position:fixed;inset:0;z-index:110;pointer-events:none;display:flex;align-items:center;justify-content:center;padding:20px}
.party canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.party-card{position:relative;pointer-events:auto;width:100%;max-width:350px;max-height:calc(100dvh - 40px);overflow:auto;text-align:center;border:1px solid var(--amber);border-radius:26px;padding:22px;background:radial-gradient(ellipse at top,color-mix(in srgb,var(--amber) 15%,var(--panel)),var(--panel) 65%);box-shadow:0 18px 70px rgba(0,0,0,.4);animation:party-in 360ms cubic-bezier(.2,.85,.3,1) both}
.party-card h2{font:600 20px/1.3 var(--disp);margin:4px 0 10px;overflow-wrap:anywhere}
.party-card p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5;white-space:pre-line}
.party-art{height:96px;display:flex;align-items:center;justify-content:center;gap:9px}
.party-bottle{display:inline-block;font-size:60px;animation:bottle-pop 850ms ease-out both}
.party-glasses{display:inline-block;font-size:44px;animation:glasses-clink 750ms ease-out 100ms both}
.party-star{position:absolute;color:var(--amber);font-size:24px;animation:party-star 900ms ease-out both}
.party-star.s1{top:24px;left:30px}.party-star.s2{top:53px;right:34px;animation-delay:150ms}
@keyframes party-in{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
@keyframes bottle-pop{0%{transform:translateY(20px) rotate(-24deg) scale(.5)}55%{transform:translateY(-6px) rotate(10deg) scale(1.12)}100%{transform:rotate(-10deg)}}
@keyframes glasses-clink{0%{opacity:0;transform:translateX(25px) rotate(14deg)}65%{opacity:1;transform:translateX(-5px) rotate(-8deg)}100%{opacity:1;transform:none}}
@keyframes party-star{0%{opacity:0;transform:scale(.2) rotate(-45deg)}60%{opacity:1;transform:scale(1.2) rotate(10deg)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.ui-enter,.ui-sheet>div,.toast,.cm-reminder.cm-attention,.cm-editor,.party-card,.party-bottle,.party-glasses,.party-star{animation:none!important}.b,.chip,.doc,.item,.nav button,.more,input,textarea,select{transition:none!important}.b:active,.chip:active,.doc:active,.nav button:active,.more:active{transform:none}}

.budget-alert{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--panel));color:var(--bad)}
.budget-alert .sub{color:var(--text)}
.signal-art{height:106px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.signal-face{display:inline-block;font-size:64px;position:relative;z-index:1}
.reaction .party-card{border-color:var(--bad);background:radial-gradient(ellipse at top,color-mix(in srgb,var(--bad) 16%,var(--panel)),var(--panel) 65%)}
.reaction .party-card h2{color:var(--bad)}
.reaction .acts{justify-content:center;flex-wrap:wrap}
.reaction .acts .b{min-height:44px}
.signal-list{display:grid;gap:7px;margin-bottom:14px;text-align:left}
.signal-list .b{text-align:left;font-size:13px;overflow-wrap:anywhere}
.reaction-scam .signal-face{animation:angry-shake 240ms ease-in-out 5}
.signal-spark{position:absolute;font-size:29px;animation:scam-spark 1.2s ease-out both}
.signal-spark.left{left:20px;top:30px}.signal-spark.right{right:18px;top:34px;animation-delay:150ms}
@keyframes angry-shake{25%{transform:translateX(-5px) rotate(-6deg)}75%{transform:translateX(5px) rotate(6deg)}}
@keyframes scam-spark{from{opacity:0;transform:translateY(12px) scale(.5)}40%{opacity:1;transform:translateY(-8px) scale(1.15)}to{opacity:0;transform:translateY(-35px) scale(.7)}}
.reaction-lost .party-card{border-color:var(--blue);background:radial-gradient(ellipse at top,color-mix(in srgb,var(--blue) 12%,var(--panel)),var(--panel) 65%)}
.reaction-lost .party-card h2{color:var(--blue)}
.reaction-lost .signal-face{animation:sad-sigh 1.5s ease-in-out 2}
@keyframes sad-sigh{50%{transform:translateY(6px) rotate(-8deg)}}
.signal-rain{position:absolute;inset:0;pointer-events:none}
.signal-rain i{position:absolute;top:0;width:2px;height:15px;background:var(--blue);opacity:0;border-radius:2px;animation:sad-rain 1.3s linear 2 both}
@keyframes sad-rain{0%{opacity:0;transform:translateY(-20px)}20%{opacity:.55}100%{opacity:0;transform:translateY(110px)}}
.reaction-budget .signal-face{animation:alarm-rock 650ms ease-in-out 4}
.alarm-ring{position:absolute;width:80px;height:80px;border:2px solid var(--bad);border-radius:50%;animation:alarm-wave 1s ease-out 3 both}
@keyframes alarm-rock{25%{transform:rotate(-8deg) scale(1.04)}75%{transform:rotate(8deg) scale(1.04)}}
@keyframes alarm-wave{from{opacity:.65;transform:scale(.8)}to{opacity:0;transform:scale(1.5)}}
@media(prefers-reduced-motion:reduce){.signal-face,.signal-spark,.signal-rain i,.alarm-ring{animation:none!important}.signal-rain,.signal-spark,.alarm-ring{display:none}}

</style>
</head>
<body>
<div id="app"><div class="empty"><span class="spin"></span><br><br>Загружаю CRM…</div></div>
<nav class="nav hid" id="nav"></nav>
<script>
const API = 'https://script.google.com/macros/s/AKfycbyvh-AKbSfcU7l3IeozRJgMb2rpxOZ_qx7rbjLeaEcf8Mbur0T81T0ljobtEKjfhpCR/exec?api=1';
const tg = window.Telegram && Telegram.WebApp;
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MSK = 3 * 3600e3;
const fmt = (ts, f) => { if (!ts) return '—'; const d = new Date(ts + MSK), p = n => String(n).padStart(2, '0');
  const dd = p(d.getUTCDate()) + '.' + p(d.getUTCMonth() + 1), hm = p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
  return f === 'd' ? dd : f === 'dy' ? dd + '.' + d.getUTCFullYear() : dd + ' ' + hm; };
const money = n => '$' + (Math.round(n * 100) / 100).toLocaleString('ru-RU');
const STE = { 'В работе': ['🟡', 'w'], 'В пути': ['✈️', 't'], 'Доехал': ['✅', 'd'], 'Архив': ['🗄', 'z'] };
const UID = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 0;
function lsGet(k) { try { const x = localStorage.getItem('crm' + UID + ':' + k); return x ? JSON.parse(x) : null; } catch (e) { return null; } }   // прошлые данные — экран открывается сразу
function lsSet(k, v) { try { localStorage.setItem('crm' + UID + ':' + k, JSON.stringify(v)); } catch (e) {} }
let LISTP = null, LDIRTY = false;                          // LDIRTY — данные менялись: список показываем сразу, свежий подтягиваем в фоне
function loadList(force) {                                  // один запрос списка на всех (старт + экран)
  if (!LISTP || force) LISTP = api('list').then(d => { LIST = d; lsSet('list', d); GOAL_FRESH = true; observeGoals(d); return d; }).finally(() => { LISTP = null; });
  return LISTP;
}
let ME = null, LIST = [], S = { tab: 'list', f: 'a', q: '', show: 'act' }, stack = [], boardTimer = null;

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function hap(k) { try { tg.HapticFeedback.notificationOccurred(k || 'success'); } catch (e) {} }
async function api(op, a, again) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ init: tg ? tg.initData : '', op: op, a: a || {} }) });
  const j = await r.json();
  if (j.err && /занята/.test(j.err) && !again) { await new Promise(res => setTimeout(res, 2000)); return api(op, a, 1); }   // таблица занята — один тихий повтор
  if (j.err) throw new Error(j.err === 'auth' || j.err === 'auth_old' ? 'Откройте приложение заново из бота' : j.err === 'noaccess' ? 'Нет доступа к CRM' : j.err);
  refreshGoalsAfterWrite(op);
  return j.d;
}
function confirmP(msg) { return new Promise(res => tg && tg.showConfirm ? tg.showConfirm(msg, res) : res(window.confirm(msg))); }
function popup(title, msg, btns) {                           // Telegram показывает не больше 3 кнопок — иначе свой список снизу
  if (btns.length > 3 || !(tg && tg.showPopup)) return sheet(title, msg, btns);
  return new Promise(res => { try { tg.showPopup({ title: title, message: msg, buttons: btns }, res); } catch (e) { sheet(title, msg, btns).then(res); } });
}
function sheet(title, msg, btns) {
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ui-sheet';
    ov.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;align-items:flex-end';
    ov.innerHTML = '<div style="width:100%;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))">'
      + '<div style="font-weight:700;font-size:17px;margin-bottom:4px">' + esc(title) + '</div><div class="sub" style="margin-bottom:14px">' + esc(msg) + '</div><div class="col">'
      + btns.map((b, i) => '<button class="b' + (b.type === 'destructive' ? ' bad' : b.type === 'cancel' ? '' : '') + '" data-i="' + i + '">' + esc(b.type === 'cancel' ? 'Отмена' : b.text) + '</button>').join('') + '</div></div>';
    const done = v => { ov.remove(); res(v); };
    ov.onclick = e => { if (e.target === ov) done(null); };
    ov.querySelectorAll('[data-i]').forEach(x => x.onclick = () => { const b = btns[+x.dataset.i]; done(b.type === 'cancel' ? null : b.id); });
    document.body.appendChild(ov);
  });
}
function b64(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); }); }
async function shrink(file) {                                  // фото — сжать до ~1600px, чтобы быстро грузилось
  if (!/^image\//.test(file.type) || file.size < 600e3) return { b: await b64(file), mime: file.type };
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return { b: c.toDataURL('image/jpeg', .85).split(',')[1], mime: 'image/jpeg' };
}

  el.querySelectorAll('[data-wp]').forEach(b => {

      setTimeout(() => { if (b.isConnected && !cooling()) { b.disabled = false; b.textContent = '🔔 Напомнить прозвонеру'; } }, Math.min(60e3, L.ping.until - Date.now())); return true; } return false; };
    cooling();

      b.disabled = true; b.innerHTML = '<span class="spin"></span>';

      catch (e) { hap('error'); toast(e.message); b.disabled = false; b.textContent = '🔔 Напомнить прозвонеру'; }

  const ansW = async (b, k, y) => { b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    try { const d = await api('wa', { k: k, y: y }); hap(); toast(y ? 'Записал: диалог есть' : 'Записал: диалога нет'); const L = WA.find(x => x.k === k) || {}; WA = WA.filter(x => x.k !== k); LDIRTY = true; waBox();

    catch (e) { hap('error'); toast(e.message); b.disabled = false; b.innerHTML = y ? 'Есть' : 'Нет'; } };

  if (!CALL.lead && !CALL.done || fresh) {
    app.innerHTML = '<div class="empty"><span class="spin"></span></div>';
    try { const q = await api('queue'); CALL = { lead: q.lead, left: q.left, done: null }; } catch (e) { app.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  }
  const head = '<div class="top"><div class="toprow"><h1 class="h1">Прозвон</h1><button class="ghost" id="rl">Обновить</button></div></div>';
  const L = CALL.lead, D = CALL.done;
  if (D) {
    app.innerHTML = head + '<div class="wrap"><div class="sec"><h2>' + esc(D.n) + '</h2><div class="flyv" style="font-size:17px">' + esc(D.res) + (D.when ? ' · ' + esc(D.when) : '') + '</div>'
      + (D.w ? '<div class="sub" style="margin-top:8px">Кандидат в работе за «' + esc(D.team) + '». Подтверждение диалога придёт вам и напарнику.</div><div class="acts" style="margin-top:12px"><button class="b" id="opn">Открыть карточку</button></div>' : '')

      + '</div>' + (D.ask ? '' : '<button class="big" id="nxt">📞 Следующая заявка</button>') + '</div>';
  } else if (!L) {
    app.innerHTML = head + '<div class="wrap"><div class="sec" style="text-align:center;padding:28px 16px"><div class="sub">В очереди</div><div class="flyv" style="font-size:44px;margin:4px 0 2px">' + CALL.left + '</div><div class="sub">заявок с начала месяца, сначала свежие и с паспортом</div></div>'
      + (CALL.left ? '<button class="big" id="nxt">📞 Дай заявку</button>' : '<div class="empty" style="padding:24px">🎉 Очередь пуста: всё разобрано или ждёт перезвона</div>') + '</div>';
  } else {
    const dg = L.ph.replace(/\D/g, '');
    app.innerHTML = head + '<div class="wrap"><div class="hero lead"><div class="name">' + (ME.flagsEmo[L.c] || '🌍') + ' ' + esc(L.n) + '</div>'
      + '<div class="meta">' + esc(L.c || '—') + ' · паспорт: ' + esc(L.pass || '—') + '</div><div class="timer" id="tmr"></div></div>'
      + '<div class="sec"><div class="acts"><button class="b" id="cp">' + esc(L.ph || 'нет номера') + '</button>' + (dg ? '<button class="b main" id="wa">WhatsApp</button>' : '') + '</div>'
      + (dg && L.na ? '<button class="b" id="wna" style="width:100%;margin-top:10px">💬 Не дозвонились — написать в WhatsApp</button><div class="sub" style="margin-top:6px">Откроется WhatsApp с готовым текстом на языке страны — останется нажать «Отправить»</div>' : '')
      + '<dl class="kv" style="margin-top:14px"><dt>Заявка</dt><dd>' + fmt(L.created) + '</dd><dt>Звонков</dt><dd>' + L.tries + (L.res ? ', последний: ' + esc(L.res) : '') + '</dd><dt>Строка</dt><dd>' + L.row + '</dd></dl></div>'
      + '<div class="sec"><h2>Результат звонка</h2><div class="col"><button class="b arr" data-r="w">✅ Перешёл в WhatsApp</button><div class="three"><button class="b" data-r="r">🔁 Перезвонить</button><button class="b bad" data-r="o">❌ Отказ</button><button class="b bad" data-r="n">🚫 Не подходит</button></div>'
      + '<button class="more" data-r="s" style="text-align:center">↩️ Вернуть в очередь</button></div></div><div class="sub" style="text-align:center">в очереди ещё ' + CALL.left + '</div></div>';
    const tick = () => { const el = $('#tmr'); if (!el) return clearInterval(callTimer); const ms = L.until - Date.now();
      if (ms <= 0) { el.textContent = 'Время вышло — заявка вернулась в очередь'; el.style.color = 'var(--bad)'; return clearInterval(callTimer); }
      el.textContent = 'Заявка ваша ещё ' + Math.floor(ms / 60e3) + ' мин ' + String(Math.floor(ms / 1e3) % 60).padStart(2, '0') + ' с'; };
    tick(); callTimer = setInterval(tick, 1000);

  on('nxt', async b => { b.disabled = true; b.innerHTML = '<span class="spin"></span>';

    catch (e) { hap('error'); toast(e.message); b.disabled = false; b.innerHTML = '📞 Дай заявку'; } });
  on('opn', () => { stack.push({ kind: 'card', k: D.k }); render(); });
  on('wna', () => { const u = 'https://wa.me/' + L.ph.replace(/\D/g, '') + '?text=' + encodeURIComponent(L.na); tg ? tg.openLink(u) : window.open(u); api('wamsg', { k: L.k }).catch(() => {}); toast('Отправьте сообщение в WhatsApp, потом отметьте результат звонка'); });

    const r = b.dataset.r;
    if ((r === 'o' || r === 'n') && !(await confirmP((r === 'o' ? 'Отказ' : 'Не подходит') + ': ' + L.n + '?'))) return;
    b.disabled = true; const t0 = b.innerHTML; b.innerHTML = '<span class="spin"></span>';
    try { const d = await api('call', { k: L.k, r: r }); hap(); LDIRTY = true;
      if (r === 's') { toast('Вернул в очередь'); CALL = { lead: null, left: CALL.left + 1, done: null }; return showCall(); }
      CALL.done = { k: L.k, n: L.n, res: d.res, team: d.team, w: r === 'w', ask: r === 'r' }; CALL.lead = null; showCall(); }
    catch (e) { hap('error'); toast(e.message); b.disabled = false; b.innerHTML = t0; } });
  app.querySelectorAll('[data-rc]').forEach(b => b.onclick = async () => { b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    try { const t = await api('recall', { k: D.k, d: b.dataset.rc }); hap(); CALL.done.ask = false; CALL.done.when = t; showCall(); } catch (e) { hap('error'); toast(e.message); } });
}

// Цели оцениваются только по свежему ответу сервера, не по кэшированному экрану.

  });

    if (!ME.boss && ME.teams.indexOf(t.t) < 0) return;
    const group = list.filter(c => c.t === t.t && activeCandidate(c)); if (!group.length) return;
    if (group.every(c => freshComment(c, now))) award('comments:' + t.t + ':' + day, 'Все комментарии обновлены! 🥂', t.e + ' ' + t.t + '\nНи одного кандидата без свежего комментария. Спасибо, что держите друг друга в курсе!');
    if (group.every(docsComplete)) award('team-docs:' + t.t + ':' + day, 'Все документы на месте! 🍾', t.e + ' ' + t.t + '\nПолные комплекты собраны у всех кандидатов в работе и в пути. Команда, вы молодцы!');

  PARTY_CLOSE = close; el.querySelector('button').onclick = close; timer = setTimeout(close, 6500);

  const width = window.innerWidth, height = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = width * dpr; canvas.height = height * dpr; ctx.scale(dpr, dpr);
  const colors = ['#F4B740', '#3DD6A8', '#7EA6FF', '#FF6E6E', '#EAF0FA'];
  const count = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4 ? 56 : 96;
  const particles = Array.from({ length: count }, (_, i) => ({ x: width / 2, y: height * .43, vx: (Math.random() - .5) * 15, vy: -5 - Math.random() * 10, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .18, color: colors[i % colors.length], size: 4 + Math.random() * 5 }));

  const memory = signalMemory(), old = memory.candidates[c.k], spent = Object.assign({},c,{sp:Number(c.ok)||0}), exhausted = budgetExhausted(spent);
  if (old && old.budget === false && activeCandidate(c) && exhausted) {
    const now = Date.now(), day = new Date(now + MSK).toISOString().slice(0,10), id = 'budget:' + c.k + ':' + ME.limit + ':' + day;
    if (!memory.seen[id]) { memory.seen[id]=now; SIGNAL_AT=now; showReaction('budget',spent); }
  }
  memory.candidates[c.k] = Object.assign({docs:docsComplete(c),st:c.st,arch:String(c.arch||'')},old,{budget:exhausted}); lsSet('goal-memory',memory);
}
function budgetBanner(c, amount) {
  const spent = amount === undefined ? Number(c.sp) || 0 : Number(amount) || 0;
  if (!(Number(ME && ME.limit) > 0) || spent < Number(ME.limit)) return '';
  return '<div class="sec budget-alert"><b>🚨 Бюджет ' + (spent > ME.limit ? 'превышен' : 'исчерпан') + '</b><div class="sub" style="margin-top:6px">Учтено ' + money(spent) + ' из ' + money(ME.limit) + (spent > ME.limit ? ' · сверх лимита ' + money(spent - ME.limit) : '') + '</div></div>';
}
function collectSignals(list, memory, now, day) {
  const signals = [];
  const add = (id, kind, c) => { if (memory.seen[id]) return; memory.seen[id] = now; signals.push({kind,c}); };
  list.forEach(c => {
    const old = memory.candidates[c.k]; if (!old) return;
    const reason = String(c.arch || '').trim();
    const changedArchive = c.st === 'Архив' && (old.st !== 'Архив' || (typeof old.arch === 'string' && old.arch !== reason));
    if (changedArchive && reason === 'Скам') add('scam:' + c.k + ':' + day, 'scam', c);
    if (changedArchive && reason === 'Пропал') add('lost:' + c.k + ':' + day, 'lost', c);
    if (activeCandidate(c) && old.budget === false && budgetExhausted(c)) add('budget:' + c.k + ':' + ME.limit + ':' + day, 'budget', c);
  });
  const priority = {scam:0,budget:1,lost:2}; return signals.sort((a,b)=>priority[a.kind]-priority[b.kind]);
}
function showReaction(kind, c, additional = []) {
  if (document.hidden) return;
  SIGNAL_AT = Date.now();
  PARTY_QUEUE = []; if (PARTY_CLOSE) PARTY_CLOSE();
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const spent = Number(c.sp) || 0, limit = Number(ME.limit) || 0;
  const variants = {
    scam: {title:'Зафиксирован скам',emoji:'😡',text:c.n + '\n' + (c.t ? c.t + '\n' : '') + 'В архиве с причиной «Скам».' + (spent ? '\nУчтённые расходы: ' + money(spent) : '')},
    lost: {title:'Кандидат пропал',emoji:'😔',text:c.n + '\n' + (c.t ? c.t + '\n' : '') + 'В архиве с причиной «Пропал». Последние договорённости сохранены в карточке.'},
    budget: {title:spent > limit ? 'Бюджет превышен!' : 'Бюджет исчерпан!',emoji:'🚨',text:c.n + '\nУчтено ' + money(spent) + ' из ' + money(limit) + (spent > limit ? '\nСверх лимита: ' + money(spent - limit) : '\nОстаток бюджета: $0') + '\nТраты, ожидающие одобрения, в эту сумму не входят.'}
  };
  const v = variants[kind]; if (!v) return;
  const decor = reduced ? '' : kind === 'lost' ? '<div class="signal-rain" aria-hidden="true">' + Array.from({length:12},(_,i)=>'<i style="left:'+(8+i*7)+'%;animation-delay:'+(i%4)*.12+'s"></i>').join('') + '</div>'
    : kind === 'scam' ? '<span class="signal-spark left" aria-hidden="true">⚡</span><span class="signal-spark right" aria-hidden="true">💸</span>' : '<span class="alarm-ring" aria-hidden="true"></span>';
  const el = document.createElement('div'); el.className = 'party reaction reaction-' + kind;
  const details = additional.length ? '<div class="signal-list"><div class="sub">Другие важные изменения</div>' + additional.map(s => '<button class="b" type="button" data-signal-open="' + esc(s.c.k) + '">' + (s.kind === 'scam' ? '😡 Скам' : s.kind === 'lost' ? '😔 Пропал' : '🚨 Бюджет ' + money(s.c.sp) + ' / ' + money(limit)) + ' · ' + esc(s.c.n) + '</button>').join('') + '</div>' : '';
  el.innerHTML = '<section class="party-card" aria-label="Важное изменение по кандидату"><div class="signal-art">' + decor + '<span class="signal-face" aria-hidden="true">' + v.emoji + '</span></div><div role="' + (kind === 'budget' ? 'alert' : 'status') + '" aria-live="' + (kind === 'budget' ? 'assertive' : 'polite') + '"><h2>' + esc(v.title) + '</h2><p>' + esc(v.text) + '</p></div>' + details + '<div class="acts"><button class="b main" type="button" data-signal-open="' + esc(c.k) + '">Открыть карточку</button><button class="b" type="button" data-signal-close>Понятно</button></div></section>';
  document.body.appendChild(el); hap('warning');
  const timer = setTimeout(close, 8000);
  function close() { clearTimeout(timer); el.remove(); PARTY_CLOSE = null; }
  PARTY_CLOSE = close; el.querySelector('[data-signal-close]').onclick = close;
  el.querySelectorAll('[data-signal-open]').forEach(b => b.onclick = () => { const key = b.dataset.signalOpen; close(); stack = [{kind:'card',k:key}]; render(); });
}

document.addEventListener('visibilitychange', () => { if (document.hidden) { PARTY_QUEUE = []; if (PARTY_CLOSE) PARTY_CLOSE(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && PARTY_CLOSE) PARTY_CLOSE(); });
// Наблюдаем только смену верхнего содержимого, без слежения за тысячами строк.
let UI_ROUTE = '';
const uiMotion = new MutationObserver(() => {
  const top = stack[stack.length - 1], route = S.tab + ':' + (top ? top.kind + ':' + (top.k || '') : '');
  if (route === UI_ROUTE || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const nodes = Array.from(app.children).filter(el => !el.classList.contains('empty')); if (!nodes.length) return;
  UI_ROUTE = route; nodes.forEach(el => { const target = el.classList.contains('top') ? el : el.querySelector('.hero,.lead'); if (target) target.classList.add('ui-enter'); });
});
uiMotion.observe(app, { childList: true });

// ---------- старт ----------
(async function () {
  if (!tg || !tg.initData) { app.innerHTML = '<div class="empty">Откройте CRM из бота <b>@Hohlorezstat_bot</b> — кнопка «📱 CRM».</div>'; return; }
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0D1626'); tg.setBackgroundColor('#0D1626'); if (tg.setBottomBarColor) tg.setBottomBarColor('#0D1626'); } catch (e) {}
  tg.BackButton.onClick(back);
  const pMe = api('me'), cME = lsGet('me'), cL = lsGet('list');
  loadList().then(() => {                                     // свежий список пришёл — тихо обновляем экран, если человек на нём и не печатает
    if (ME && !stack.length && S.tab === 'list' && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) { const y = window.scrollY; showList(); window.scrollTo(0, y); }
  }).catch(() => {});
  const sp = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  if (/^c_/.test(sp)) stack.push({ kind: 'card', k: sp.slice(2) });
  if (cME) { ME = cME; if (cL && cL.length) LIST = cL; render(); }
  try { ME = await pMe; lsSet('me', ME); } catch (e) { if (!cME) { app.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; } }
  if (GOAL_FRESH) observeGoals(LIST);
  if (!cME) render(); else nav();
})();
</script>
